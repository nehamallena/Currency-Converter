
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f1f3ff;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            display: none;
        }

        .error {
            margin-top: 15px;
            color: red;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Currency Converter</h1>
        <p class="subtitle">Convert between different currencies</p>

        <label for="amount">Enter Amount</label>
        <input type="number" id="amount" placeholder="Enter amount">

        <label for="from">From Currency</label>
        <select id="from">
            <option value="INR">INR - Indian Rupee</option>
            <option value="LKR">LKR - Sri Lankan Rupee</option>
            <option value="JPY">JPY - Japanese Yen</option>
            <option value="CPY">CPY - Chinese Yaun</option>
            <option value="SGD">SGD - Singapore Dollar</option>
            <option value="KRW">KRW - South Korean Won</option>
            <option value="HKD">HKD - Hong Kong Dollar</option>
            <option value="AED">AED - UAE Dirham</option>
            <option value="SAR">SAR - Saudi Riyal</option>
            <option value="THB">THB - Thai Baht</option>
            <option value="MYR">MYR - Malaysian Ringgit</option>
            <option value="IDR">IDR - Indonesian Rupiah</option>
            <option value="PHP">PHP - Philippine Peso</option>
            <option value="VND">VND - Vietnamese Dong</option>
            <option value="BDT">BDT - Bangladeshi Taka</option>
            <option value="PKR">PKR - Pakistani Rupee</option>
            <option value="NPR">NPR - Nepalese Rupee</option>
            <option value="TWD">TWD - New Taiwan Dollar</option>
            <option value="QAR">QAR - Qatari Riyal</option>
            <option value="KWD">KWD - Kuwaiti Dinar</option>
        </select>

        <label for="to">To Currency</label>
        <select id="to">
            <option value="INR">INR - Indian Rupee</option>
            <option value="LKR">LKR - Sri Lankan Rupee</option>
            <option value="JPY">JPY - Japanese Yen</option>
            <option value="CNY">CNY - Chinese Yuan</option>
            <option value="SGD">SGD - Singapore Dollar</option>
            <option value="KRW">KRW - South Korean Won</option>
            <option value="HKD">HKD - Hong Kong Dollar</option>
            <option value="AED">AED - UAE Dirham</option>
            <option value="SAR">SAR - Saudi Riyal</option>
            <option value="THB">THB - Thai Baht</option>
            <option value="MYR">MYR - Malaysian Ringgit</option>
            <option value="IDR">IDR - Indonesian Rupiah</option>
            <option value="PHP">PHP - Philippine Peso</option>
            <option value="VND">VND - Vietnamese Dong</option>
            <option value="BDT">BDT - Bangladeshi Taka</option>
            <option value="PKR">PKR - Pakistani Rupee</option>
            <option value="NPR">NPR - Nepalese Rupee</option>
            <option value="TWD">TWD - New Taiwan Dollar</option>
            <option value="QAR">QAR - Qatari Riyal</option>
            <option value="KWD">KWD - Kuwaiti Dinar</option>
            
        </select>

        <button onclick="convertCurrency()">Convert</button>

        <div class="error" id="error">
            Please enter a valid amount.
        </div>

        <div class="result" id="result"></div>

    </div>

    <script>

        // Exchange rates based on USD
        const rates = {
            INR: 1.0,
            LKR: 3.434,
            JPY: 1.639,
            CNY: 0.070,
            SGD: 0.013,
            KRW: 16.50,   // South Korea
            HKD: 0.091,   // Hong Kong
            AED: 0.041,   // UAE
            SAR: 0.042,   // Saudi Arabia
            THB: 0.37,    // Thailand
            MYR: 0.047,   // Malaysia
            IDR: 190,     // Indonesia
            PHP: 0.67,    // Philippines
            VND: 300,     // Vietnam
            BDT: 1.34,    // Bangladesh
            PKR: 3.15,    // Pakistan
            NPR: 1.60,    // Nepal
            TWD: 0.36,    // Taiwan
            QAR: 0.041,   // Qatar
            KWD: 0.013,   // Kuwait

        };

        function convertCurrency() {

            const amount = parseFloat(
                document.getElementById("amount").value
            );

            const from = document.getElementById("from").value;
            const to = document.getElementById("to").value;

            const resultBox = document.getElementById("result");
            const errorBox = document.getElementById("error");

            // Check amount
            if (isNaN(amount) || amount <= 0) {
                errorBox.style.display = "block";
                resultBox.style.display = "none";
                return;
            }

            errorBox.style.display = "none";

            // Same currency
            if (from === to) {
                resultBox.innerHTML =
                    `${amount.toFixed(2)} ${from} = ${amount.toFixed(2)} ${to}`;

                resultBox.style.display = "block";
                return;
            }

            // Convert source currency to USD
            const amountInUSD = amount / rates[from];

            // Convert USD to target currency
            const convertedAmount = amountInUSD * rates[to];

            resultBox.innerHTML =
                `${amount.toFixed(2)} ${from} = 
                 ${convertedAmount.toFixed(2)} ${to}`;

            resultBox.style.display = "block";
        }

    </script>

</body>
</html>
